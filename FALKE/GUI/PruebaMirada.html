<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de mirada</title>
    <style>
        html, body { height: 100%; margin: 0; background: #14181f; color: #e8ecf1; font-family: system-ui, sans-serif; overflow: hidden; }
        #panel { position: fixed; top: 16px; left: 16px; padding: 12px 16px; background: rgba(0, 0, 0, .55); border-radius: 10px; z-index: 2; line-height: 1.6; }
        #panel button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
        #punto { position: fixed; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: rgba(255, 180, 60, .75); border: 2px solid #fff; pointer-events: none; display: none; z-index: 1; }
    </style>
</head>
<body>
    <div id="panel">
        <div>Conexion con el agente: <strong id="conexion">desconectado</strong></div>
        <div>Estado del Tobii: <strong id="estado">-</strong></div>
        <div>Mirada: <span id="coordenadas">-</span></div>
        <button id="btnPantallaCompleta" type="button">Pantalla completa</button>
    </div>
    <div id="punto"></div>

    <script src="Scripts/mirada-cliente.js"></script>
    <script>
        (function () {
            var SUAVIZADO = 0.35;

            var punto = document.getElementById("punto");
            var textoConexion = document.getElementById("conexion");
            var textoEstado = document.getElementById("estado");
            var textoCoordenadas = document.getElementById("coordenadas");

            var actual = null;

            var cliente = new ClienteMirada();

            cliente.on("conexion", function (conectado) {
                textoConexion.textContent = conectado ? "conectado" : "desconectado";

                if (!conectado) punto.style.display = "none";
            });

            cliente.on("estado", function (estado) {
                textoEstado.textContent = estado;
            });

            cliente.on("mirada", function (mensaje) {
                if (!mensaje.valida) {
                    punto.style.display = "none";
                    textoCoordenadas.textContent = "sin mirada valida";
                    return;
                }

                var destino = ClienteMirada.aViewport(mensaje.x, mensaje.y);

                actual = actual === null
                    ? destino
                    : { x: actual.x + SUAVIZADO * (destino.x - actual.x), y: actual.y + SUAVIZADO * (destino.y - actual.y) };

                punto.style.display = "block";
                punto.style.transform = "translate(" + actual.x + "px, " + actual.y + "px)";
                textoCoordenadas.textContent = "x=" + mensaje.x.toFixed(3) + " y=" + mensaje.y.toFixed(3);
            });

            document.getElementById("btnPantallaCompleta").addEventListener("click", function () {
                document.documentElement.requestFullscreen();
            });

            cliente.conectar();
        })();
    </script>
</body>
</html>
